# Bundle patch layer for dsh-conversation-bridge.
#
# 本插件只管"交接"这一个问题：开新对话、回问旧对话、只读翻旧对话的日志。
# 零第三方依赖；不接入、不探测、不提及任何记忆插件。
#
# 下面全是默认值。要改就在你自己的 profile patch 层里用同一个 id 覆盖：
#   - id: conversation-bridge
#     config: { ... }
# 注意：profile 层的 config 会**整体替换**这里的 config，所以插件内部是逐字段
# 与默认值合并的，你只写想改的字段即可。
- insert:
    - id: conversation-bridge
      name: dsh-conversation-bridge
      config:
        # 是否注册工具（关掉后插件仍加载，只是不提供任何工具）
        exposeTools: true

        # ---- 跨对话发消息 ----
        # 只保留一个"防呆"：全局限频。**没有**冷却、环路检测、深度上限——
        # 那条管道该像宿主自己的 send_message（主子 agent 通信）一样纯：
        # 防滥用的责任在调用方判断与用户的可视干预，不在工具层设门禁（真机事故的教训）。
        ask:
          # 全局限流：每分钟最多投递多少条（防的是代码死循环，不是防模型发得勤）
          globalPerMinute: 30
          # steer = 插进对方当前回合的下一步（**默认**：对方正在思考/跑工具也能立刻看到）；
          # queue = 等对方本轮跑完再排（需要"不打断它"时才显式用）。
          # 注意：这里与代码里的 DEFAULTS 必须一致——两处默认值各说各话，真机排查极费时间。
          defaultMode: steer
          # 默认是否把内容包成窄指令（只回答、不复盘、不重做）；调用方可按次传 narrow: false 覆盖
          narrow: true
          # 估算"这一问之后对方会涨多少 token"时，给答复预留的量
          replyAllowanceTokens: 1500

        # ---- 翻旧书（回退底线）----
        archive:
          # 单次扫描的事件上限，超了截断并提示缩小范围
          maxScanEvents: 3000
          # 检索最多返回多少条命中
          maxHits: 20
          # 单块原文/片段的最大字符数
          maxBlockChars: 2400
          # 目录最多给多少轮（取最新的）
          outlineMaxTurns: 50
          # 读取时是否包含工具结果（压缩最容易丢的就是它，默认包含）
          includeToolResults: true
          # 每页最多多少条消息
          pageSize: 30
          # 单次调用最多向后翻几页
          maxPages: 8
          # conversation_list 默认返回多少行
          listLimit: 30

        # ---- 交接（水位提醒 + 自持交接件）----
        handoff:
          # 越阈值时注入一条提醒，指路"写交接件 → 开新对话"
          enabled: true
          # 占用到 70% 提醒；宿主的自动压缩线通常压在 0.80
          threshold: 0.7
          # 占比回落到该值以下才重新武装（压缩/新对话之后）
          rearmBelow: 0.55
          # 两次提醒之间的最小间隔（毫秒）
          cooldownMs: 600000
          # 交接过（或写过交接件）之后，本对话静默多久（毫秒）
          handoffQuietMs: 1800000
          # 同一会话两次压力评估的最小间隔（毫秒）：启动期与事件风暴时降载
          evalMinIntervalMs: 1000
          # steer = 落进下一步并唤醒（默认）；queue = 排到下一轮
          deliver: steer
          # 子 agent 会话不提醒
          skipSubagents: true
          # 是否提供 conversation_handoff_write；关掉后提醒会改为"用你惯用的写文件工具"
          toolEnabled: true
          # 交接件目录；空 = <会话 cwd>/.dsh-conversation-bridge/handoffs/
          dir: ""
          # 每段最小字符数，不达标拒绝写入（四段是硬契约）
          minSectionChars: 40
          # 渲染用的四段标题（顺序即契约顺序，请勿增删）
          sections: ["任务状态", "目标", "已试方案与失败原因", "进度与下一步"]

        # ---- 交接关系账（投递范围的产品边界）----
        # 宿主对**普通会话**不记录"B 是 A 建出来的"，所以"谁开了谁"由插件在 conversation_start
        # 成功时自己记一笔；conversation_send 只允许发往交接双方，其余一律拒（见 DESIGN §7.4）。
        lineage:
          # 账本文件；空 = ~/.dsh-conversation-bridge/lineage.json
          file: ""
          # 最多保留多少条边（超出丢最旧）
          limit: 200
