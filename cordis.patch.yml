# Bundle patch layer for dsh-conversation-bridge.
#
# 本插件只管"交接"这一个问题：开新对话、回问旧对话、只读翻旧对话的日志。
# 零第三方依赖；不接入、不探测、不提及任何记忆插件。
#
# 下面全是默认值。要改就在你自己的 profile patch 层里用同一个 id 覆盖：
#   - id: conversation-bridge
#     config: { ... }
# 注意：profile 层的 config 会**整体替换**这里的 config，所以插件内部是逐字段
# 与默认值合并的，你只写想改的字段即可。
- insert:
    - id: conversation-bridge
      name: dsh-conversation-bridge
      config:
        # 是否注册工具（关掉后插件仍加载，只是不提供任何工具）
        exposeTools: true

        # ---- 回问（首选取数方式）----
        ask:
          # 回问链的最大跳数（B 问 A=1 跳，A 再问 C=2 跳…）
          maxDepth: 3
          # 同一对"提问方→目标"的最小间隔（毫秒），防连续刷屏
          pairCooldownMs: 600000
          # 全局限流：每分钟最多发多少次回问
          globalPerMinute: 30
          # queue = 排到对方下一轮（默认）；steer = 插到它当前回合下一步
          defaultMode: queue
          # 是否把问题包成窄指令（只回答、不复盘、不重做、不动文件）
          narrow: true
          # 估算"这一问之后对方会涨多少 token"时，给答复预留的量
          replyAllowanceTokens: 1500

        # ---- 翻旧书（回退底线）----
        archive:
          # 单次扫描的事件上限，超了截断并提示缩小范围
          maxScanEvents: 3000
          # 检索最多返回多少条命中
          maxHits: 20
          # 单块原文/片段的最大字符数
          maxBlockChars: 2400
          # 目录最多给多少轮（取最新的）
          outlineMaxTurns: 50
          # 读取时是否包含工具结果（压缩最容易丢的就是它，默认包含）
          includeToolResults: true
          # 每页最多多少条消息
          pageSize: 30
          # 单次调用最多向后翻几页
          maxPages: 8
          # conversation_list 默认返回多少行
          listLimit: 30
